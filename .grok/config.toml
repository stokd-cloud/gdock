# BEGIN zenith
[mcp_servers.zenith]
command = "uv"
args = ["run", "--project", "/opt/worktrees/stokd-cloud/mono/main/apps/zenith/zenith", "zenith-server", "--mode", "orchestrator"]
startup_timeout_sec = 30
tool_timeout_sec = 1000000

[mcp_servers.zenith.env]
ZENITH_ORCHESTRATOR_PROVIDER = "grok"
ZENITH_WORKER_PROVIDER = "grok"
ZENITH_WORKER_ACP_COMMAND = "grok agent --always-approve -m grok-4.5 stdio"
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "128000"
# END zenith
